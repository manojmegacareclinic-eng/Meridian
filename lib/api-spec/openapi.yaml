openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Global Diplomatic Relations platform API
servers:
- url: /api
  description: Base API path
tags:
- name: health
- name: dashboard
- name: countries
- name: contacts
- name: meetings
- name: agreements
- name: activity
- name: audit
- name: admin
- name: documents
- name: news
- name: ministries
- name: positions
- name: office_terms
- name: organizations
- name: dr_strategies
- name: action_items
- name: deliverables
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags:
      - health
      summary: Health check
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags:
      - dashboard
      summary: Get executive dashboard summary
      responses:
        '200':
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummary'
  /countries:
    get:
      operationId: listCountries
      tags:
      - countries
      summary: List countries
      parameters:
      - $ref: '#/components/parameters/Search'
      - name: region
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Countries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Country'
    post:
      operationId: createCountry
      tags:
      - countries
      summary: Create a country workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CountryInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Country'
  /countries/{id}:
    get:
      operationId: getCountry
      tags:
      - countries
      summary: Get a country workspace
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Country
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Country'
        '404':
          description: Country not found
    patch:
      operationId: updateCountry
      tags:
      - countries
      summary: Update a country workspace
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CountryUpdate'
      responses:
        '200':
          description: Updated country
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Country'
        '404':
          description: Country not found
  /contacts:
    get:
      operationId: listContacts
      tags:
      - contacts
      summary: List diplomatic contacts
      parameters:
      - $ref: '#/components/parameters/Search'
      - name: countryId
        in: query
        schema:
          type: integer
      - name: status
        in: query
        schema:
          type: string
          enum:
          - verified
          - review
          - outdated
      responses:
        '200':
          description: Contacts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Contact'
    post:
      operationId: createContact
      tags:
      - contacts
      summary: Create a contact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
  /meetings:
    get:
      operationId: listMeetings
      tags:
      - meetings
      summary: List meetings
      parameters:
      - name: status
        in: query
        schema:
          type: string
          enum:
          - scheduled
          - completed
          - follow_up
      - name: countryId
        in: query
        schema:
          type: integer
      responses:
        '200':
          description: Meetings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Meeting'
    post:
      operationId: createMeeting
      tags:
      - meetings
      summary: Schedule a meeting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeetingInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meeting'
  /meetings/{id}:
    patch:
      operationId: updateMeeting
      tags:
      - meetings
      summary: Update a meeting
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeetingUpdate'
      responses:
        '200':
          description: Updated meeting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meeting'
        '404':
          description: Meeting not found
  /agreements:
    get:
      operationId: listAgreements
      tags:
      - agreements
      summary: List agreements
      parameters:
      - $ref: '#/components/parameters/Search'
      - name: status
        in: query
        schema:
          type: string
          enum:
          - draft
          - review
          - signed
          - archived
      - name: countryId
        in: query
        schema:
          type: integer
      responses:
        '200':
          description: Agreements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Agreement'
    post:
      operationId: createAgreement
      tags:
      - agreements
      summary: Create an agreement record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgreementInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agreement'
  /agreements/{id}:
    patch:
      operationId: updateAgreement
      tags:
      - agreements
      summary: Update an agreement
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgreementUpdate'
      responses:
        '200':
          description: Updated agreement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agreement'
        '404':
          description: Agreement not found
  /activity:
    get:
      operationId: listActivity
      tags:
      - activity
      summary: List recent activity
      parameters:
      - name: countryId
        in: query
        schema:
          type: integer
      responses:
        '200':
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Activity'
  /audit:
    get:
      operationId: listAudit
      tags:
      - audit
      summary: List the queryable audit trail
      parameters:
      - name: action
        in: query
        schema:
          type: string
      - name: entityType
        in: query
        schema:
          type: string
      - name: entityId
        in: query
        schema:
          type: string
      - name: actorId
        in: query
        schema:
          type: string
      - $ref: '#/components/parameters/AuditLimit'
      responses:
        '200':
          description: Audit trail
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditEntry'
  /documents:
    get:
      operationId: listDocuments
      tags:
      - documents
      summary: List documents for a country
      parameters:
      - name: countryId
        in: query
        schema:
          type: integer
      - name: type
        in: query
        schema:
          type: string
      - name: status
        in: query
        schema:
          type: string
          enum:
          - draft
          - review
          - approved
          - signed
          - archived
      - name: agreementId
        in: query
        schema:
          type: integer
      - name: limit
        in: query
        schema:
          type: integer
      responses:
        '200':
          description: Documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Document'
    post:
      operationId: createDocument
      tags:
      - documents
      summary: Create a document record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
  /documents/{id}:
    patch:
      operationId: updateDocument
      tags:
      - documents
      summary: Update a document
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentUpdate'
      responses:
        '200':
          description: Updated document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '404':
          description: Document not found
    delete:
      operationId: deleteDocument
      tags:
      - documents
      summary: Delete a document
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
        '404':
          description: Document not found
  /news:
    get:
      operationId: listNews
      tags:
      - news
      summary: List news items for a country
      parameters:
      - name: countryId
        in: query
        schema:
          type: integer
      - name: limit
        in: query
        schema:
          type: integer
      responses:
        '200':
          description: News items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/News'
    post:
      operationId: createNews
      tags:
      - news
      summary: Create a news item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewsInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/News'
  /news/{id}:
    patch:
      operationId: updateNews
      tags:
      - news
      summary: Update a news item
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewsUpdate'
      responses:
        '200':
          description: Updated news item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/News'
        '404':
          description: News item not found
    delete:
      operationId: deleteNews
      tags:
      - news
      summary: Delete a news item
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
        '404':
          description: News item not found
  /admin/users:
    get:
      operationId: listAdminUsers
      tags:
      - admin
      summary: List all workspace users
      responses:
        '200':
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminUser'
    post:
      operationId: createAdminUser
      tags:
      - admin
      summary: Create a workspace user (temp password issued)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserCreation'
  /admin/users/{id}/role:
    patch:
      operationId: updateAdminUserRole
      tags:
      - admin
      summary: Update a workspace user's global role
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRoleBody'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateUserRoleResponse'
  /admin/members:
    get:
      operationId: listAdminMembers
      tags:
      - admin
      summary: List workspace members and invitations
      responses:
        '200':
          description: Members and invitations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminMembersOverview'
  /admin/invitations:
    post:
      operationId: createAdminInvitation
      tags:
      - admin
      summary: Invite an existing account to the workspace org
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvitationBody'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationCreation'
  /ministries:
    get:
      operationId: listMinistries
      tags:
      - ministries
      summary: List ministries for a country
      parameters:
      - name: countryId
        in: query
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Ministries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ministry'
    post:
      operationId: createMinistry
      tags:
      - ministries
      summary: Create a ministry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MinistryInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ministry'
  /ministries/{id}:
    patch:
      operationId: updateMinistry
      tags:
      - ministries
      summary: Update a ministry
      parameters:
      - $ref: '#/components/parameters/MinistryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MinistryUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ministry'
        '404':
          description: Ministry not found
    delete:
      operationId: deleteMinistry
      tags:
      - ministries
      summary: Delete a ministry
      parameters:
      - $ref: '#/components/parameters/MinistryId'
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
        '404':
          description: Ministry not found
  /ministries/{id}/positions:
    get:
      operationId: listPositions
      tags:
      - positions
      summary: List positions for a ministry
      parameters:
      - $ref: '#/components/parameters/MinistryId'
      responses:
        '200':
          description: Positions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Position'
    post:
      operationId: createPosition
      tags:
      - positions
      summary: Create a position
      parameters:
      - $ref: '#/components/parameters/MinistryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PositionInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Position'
  /positions/{id}:
    patch:
      operationId: updatePosition
      tags:
      - positions
      summary: Update a position
      parameters:
      - $ref: '#/components/parameters/PositionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PositionUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Position'
        '404':
          description: Position not found
    delete:
      operationId: deletePosition
      tags:
      - positions
      summary: Delete a position
      parameters:
      - $ref: '#/components/parameters/PositionId'
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
        '404':
          description: Position not found
  /positions/{id}/terms:
    get:
      operationId: listOfficeTerms
      tags:
      - office_terms
      summary: List office terms for a position
      parameters:
      - $ref: '#/components/parameters/PositionId'
      responses:
        '200':
          description: Office terms
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OfficeTerm'
    post:
      operationId: createOfficeTerm
      tags:
      - office_terms
      summary: Create an office term
      parameters:
      - $ref: '#/components/parameters/PositionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfficeTermInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfficeTerm'
  /terms/{id}:
    patch:
      operationId: updateOfficeTerm
      tags:
      - office_terms
      summary: Update an office term
      parameters:
      - $ref: '#/components/parameters/TermId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfficeTermUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfficeTerm'
        '404':
          description: Office term not found
    delete:
      operationId: deleteOfficeTerm
      tags:
      - office_terms
      summary: Delete an office term
      parameters:
      - $ref: '#/components/parameters/TermId'
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
        '404':
          description: Office term not found
  /organizations:
    get:
      operationId: listOrganizations
      tags:
      - organizations
      summary: List organizations for a country
      parameters:
      - name: countryId
        in: query
        required: true
        schema:
          type: integer
      - name: type
        in: query
        schema:
          type: string
          enum:
          - ministry
          - embassy
          - city
          - university
          - ngo
          - party
          - religious
      responses:
        '200':
          description: Organizations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Organization'
    post:
      operationId: createOrganization
      tags:
      - organizations
      summary: Create an organization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
  /organizations/{id}:
    get:
      operationId: getOrganization
      tags:
      - organizations
      summary: Get an organization
      parameters:
      - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: Organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '404':
          description: Organization not found
    patch:
      operationId: updateOrganization
      tags:
      - organizations
      summary: Update an organization
      parameters:
      - $ref: '#/components/parameters/OrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '404':
          description: Organization not found
    delete:
      operationId: deleteOrganization
      tags:
      - organizations
      summary: Delete an organization
      parameters:
      - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
        '404':
          description: Organization not found
  /dr-strategies:
    get:
      operationId: listDrStrategies
      tags:
      - dr_strategies
      summary: List DR strategies for a country
      parameters:
      - name: countryId
        in: query
        required: true
        schema:
          type: integer
      - name: isActive
        in: query
        schema:
          type: boolean
      responses:
        '200':
          description: DR Strategies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DrStrategy'
    post:
      operationId: createDrStrategy
      tags:
      - dr_strategies
      summary: Create a DR strategy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DrStrategyInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DrStrategy'
  /dr-strategies/{id}:
    get:
      operationId: getDrStrategy
      tags:
      - dr_strategies
      summary: Get a DR strategy
      parameters:
      - $ref: '#/components/parameters/DrStrategyId'
      responses:
        '200':
          description: DR Strategy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DrStrategy'
        '404':
          description: DR Strategy not found
    patch:
      operationId: updateDrStrategy
      tags:
      - dr_strategies
      summary: Update a DR strategy
      parameters:
      - $ref: '#/components/parameters/DrStrategyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DrStrategyUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DrStrategy'
        '404':
          description: DR Strategy not found
    delete:
      operationId: deleteDrStrategy
      tags:
      - dr_strategies
      summary: Delete a DR strategy
      parameters:
      - $ref: '#/components/parameters/DrStrategyId'
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
        '404':
          description: DR Strategy not found
  /dr-strategies/{id}/stages:
    get:
      operationId: listDrStrategyStages
      tags:
      - dr_strategies
      summary: List stages for a DR strategy
      parameters:
      - $ref: '#/components/parameters/DrStrategyId'
      responses:
        '200':
          description: Strategy stages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DrStrategyStage'
  /meetings/{id}/agenda:
    get:
      operationId: listMeetingAgenda
      tags:
      - meetings
      summary: List agenda items for a meeting
      parameters:
      - $ref: '#/components/parameters/MeetingId'
      responses:
        '200':
          description: Agenda items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MeetingAgenda'
    post:
      operationId: createMeetingAgenda
      tags:
      - meetings
      summary: Create an agenda item
      parameters:
      - $ref: '#/components/parameters/MeetingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeetingAgendaInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
