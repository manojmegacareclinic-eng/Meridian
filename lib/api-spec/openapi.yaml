openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Global Diplomatic Relations platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: dashboard
  - name: countries
  - name: contacts
  - name: meetings
  - name: agreements
  - name: activity
  - name: audit
  - name: admin
  - name: documents
  - name: news
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get executive dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /countries:
    get:
      operationId: listCountries
      tags: [countries]
      summary: List countries
      parameters:
        - $ref: "#/components/parameters/Search"
        - name: region
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Countries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Country"
    post:
      operationId: createCountry
      tags: [countries]
      summary: Create a country workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CountryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Country"
  /countries/{id}:
    get:
      operationId: getCountry
      tags: [countries]
      summary: Get a country workspace
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Country
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Country"
        "404":
          description: Country not found
    patch:
      operationId: updateCountry
      tags: [countries]
      summary: Update a country workspace
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CountryUpdate"
      responses:
        "200":
          description: Updated country
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Country"
        "404":
          description: Country not found
  /contacts:
    get:
      operationId: listContacts
      tags: [contacts]
      summary: List diplomatic contacts
      parameters:
        - $ref: "#/components/parameters/Search"
        - name: countryId
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
            enum: [verified, review, outdated]
      responses:
        "200":
          description: Contacts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Contact"
    post:
      operationId: createContact
      tags: [contacts]
      summary: Create a contact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
  /meetings:
    get:
      operationId: listMeetings
      tags: [meetings]
      summary: List meetings
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [scheduled, completed, follow_up]
        - name: countryId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Meetings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Meeting"
    post:
      operationId: createMeeting
      tags: [meetings]
      summary: Schedule a meeting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MeetingInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meeting"
  /meetings/{id}:
    patch:
      operationId: updateMeeting
      tags: [meetings]
      summary: Update a meeting
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MeetingUpdate"
      responses:
        "200":
          description: Updated meeting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meeting"
        "404":
          description: Meeting not found
  /agreements:
    get:
      operationId: listAgreements
      tags: [agreements]
      summary: List agreements
      parameters:
        - $ref: "#/components/parameters/Search"
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, review, signed, archived]
        - name: countryId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Agreements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Agreement"
    post:
      operationId: createAgreement
      tags: [agreements]
      summary: Create an agreement record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgreementInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agreement"
  /agreements/{id}:
    patch:
      operationId: updateAgreement
      tags: [agreements]
      summary: Update an agreement
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgreementUpdate"
      responses:
        "200":
          description: Updated agreement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agreement"
        "404":
          description: Agreement not found
  /activity:
    get:
      operationId: listActivity
      tags: [activity]
      summary: List recent activity
      parameters:
        - name: countryId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Activity"
  /audit:
    get:
      operationId: listAudit
      tags: [audit]
      summary: List the queryable audit trail
      parameters:
        - name: action
          in: query
          schema:
            type: string
        - name: entityType
          in: query
          schema:
            type: string
        - name: entityId
          in: query
          schema:
            type: string
        - name: actorId
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/AuditLimit"
      responses:
        "200":
          description: Audit trail
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEntry"
  /documents:
    get:
      operationId: listDocuments
      tags: [documents]
      summary: List documents for a country
      parameters:
        - name: countryId
          in: query
          schema:
            type: integer
        - name: type
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, review, approved, signed, archived]
        - name: agreementId
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Document"
    post:
      operationId: createDocument
      tags: [documents]
      summary: Create a document record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
  /documents/{id}:
    patch:
      operationId: updateDocument
      tags: [documents]
      summary: Update a document
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentUpdate"
      responses:
        "200":
          description: Updated document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "404":
          description: Document not found
    delete:
      operationId: deleteDocument
      tags: [documents]
      summary: Delete a document
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"
        "404":
          description: Document not found
  /news:
    get:
      operationId: listNews
      tags: [news]
      summary: List news items for a country
      parameters:
        - name: countryId
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: News items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/News"
    post:
      operationId: createNews
      tags: [news]
      summary: Create a news item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewsInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/News"
  /news/{id}:
    patch:
      operationId: updateNews
      tags: [news]
      summary: Update a news item
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewsUpdate"
      responses:
        "200":
          description: Updated news item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/News"
        "404":
          description: News item not found
    delete:
      operationId: deleteNews
      tags: [news]
      summary: Delete a news item
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"
        "404":
          description: News item not found
  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      summary: List all workspace users
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"
    post:
      operationId: createAdminUser
      tags: [admin]
      summary: Create a workspace user (temp password issued)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserCreation"
  /admin/users/{id}/role:
    patch:
      operationId: updateAdminUserRole
      tags: [admin]
      summary: Update a workspace user's global role
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRoleBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateUserRoleResponse"
  /admin/members:
    get:
      operationId: listAdminMembers
      tags: [admin]
      summary: List workspace members and invitations
      responses:
        "200":
          description: Members and invitations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMembersOverview"
  /admin/invitations:
    post:
      operationId: createAdminInvitation
      tags: [admin]
      summary: Invite an existing account to the workspace org
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvitationBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationCreation"
components:
  parameters:
    Search:
      name: search
      in: query
      schema:
        type: string
    AuditLimit:
      name: limit
      in: query
      schema:
        type: integer
        default: 50
        maximum: 200
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    DashboardSummary:
      type: object
      required: [countries, contacts, activeEngagements, meetingsThisMonth, agreements, pipeline]
      properties:
        countries:
          type: integer
        contacts:
          type: integer
        activeEngagements:
          type: integer
        meetingsThisMonth:
          type: integer
        agreements:
          type: integer
        pipeline:
          type: array
          items:
            $ref: "#/components/schemas/PipelineStage"
    PipelineStage:
      type: object
      required: [stage, count]
      properties:
        stage:
          type: string
        count:
          type: integer
    Country:
      type: object
      required: [id, name, code, region, status, contactsCount, meetingsCount, riskLevel]
      properties:
        id: { type: integer }
        name: { type: string }
        code: { type: string }
        region: { type: string }
        status:
          type: string
          enum: [active, leads, inactive, agreement, scheduled]
        contactsCount: { type: integer }
        meetingsCount: { type: integer }
        riskLevel:
          type: string
          enum: [low, medium, high]
        language: { type: string }
        governmentType:
          type: string
          enum: [presidential republic, semi-presidential, parliamentary republic, parliamentary monarchy, constitutional monarchy, absolute monarchy, one-party state, transitional]
        electionYear: { type: integer }
        team: { type: string }
        priority:
          type: string
          enum: [low, medium, high]
        strategy: { type: string }
    CountryUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        code: { type: string, minLength: 2, maxLength: 3 }
        region: { type: string, minLength: 1 }
        status:
          type: string
          enum: [active, leads, inactive, agreement, scheduled]
        riskLevel:
          type: string
          enum: [low, medium, high]
        language: { type: string }
        governmentType:
          type: string
          enum: [presidential republic, semi-presidential, parliamentary republic, parliamentary monarchy, constitutional monarchy, absolute monarchy, one-party state, transitional]
        electionYear: { type: integer }
        team: { type: string }
        priority:
          type: string
          enum: [low, medium, high]
        strategy: { type: string }
    CountryInput:
      type: object
      required: [name, code, region]
      properties:
        name: { type: string, minLength: 1 }
        code: { type: string, minLength: 2, maxLength: 3 }
        region: { type: string, minLength: 1 }
        status:
          type: string
          enum: [active, leads, inactive, agreement, scheduled]
    Contact:
      type: object
      required: [id, name, title, institution, countryId, countryName, email, verificationStatus, lastVerified, relationship]
      properties:
        id: { type: integer }
        name: { type: string }
        title: { type: string }
        institution: { type: string }
        countryId: { type: integer }
        countryName: { type: string }
        email: { type: string }
        phone:
          type: ["string", "null"]
        verificationStatus:
          type: string
          enum: [verified, review, outdated]
        lastVerified:
          type: string
          format: date
        relationship: { type: string }
    ContactInput:
      type: object
      required: [name, title, institution, countryId, email, relationship]
      properties:
        name: { type: string, minLength: 1 }
        title: { type: string, minLength: 1 }
        institution: { type: string, minLength: 1 }
        countryId: { type: integer }
        email: { type: string, format: email }
        phone: { type: string }
        relationship: { type: string }
    Meeting:
      type: object
      required: [id, title, countryName, date, status, participants, actionArea]
      properties:
        id: { type: integer }
        title: { type: string }
        countryName: { type: string }
        date: { type: string, format: date-time }
        status:
          type: string
          enum: [scheduled, completed, follow_up]
        participants: { type: integer }
        actionArea: { type: string }
        owner: { type: string }
    MeetingInput:
      type: object
      required: [title, countryId, date, actionArea]
      properties:
        title: { type: string, minLength: 1 }
        countryId: { type: integer }
        date: { type: string, format: date-time }
        actionArea: { type: string, minLength: 1 }
        owner: { type: string }
    MeetingUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1 }
        date: { type: string, format: date-time }
        status:
          type: string
          enum: [scheduled, completed, follow_up]
        actionArea: { type: string, minLength: 1 }
        owner: { type: string }
    Agreement:
      type: object
      required: [id, name, type, countryName, status, updatedAt]
      properties:
        id: { type: integer }
        name: { type: string }
        type: { type: string }
        countryName: { type: string }
        status:
          type: string
          enum: [draft, review, signed, archived]
        updatedAt: { type: string, format: date }
        renewalDate:
          type: ["string", "null"]
          format: date
    AgreementInput:
      type: object
      required: [name, type, countryId]
      properties:
        name: { type: string, minLength: 1 }
        type: { type: string, minLength: 1 }
        countryId: { type: integer }
        status:
          type: string
          enum: [draft, review, signed, archived]
        renewalDate: { type: string, format: date }
    AgreementUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        type: { type: string, minLength: 1 }
        status:
          type: string
          enum: [draft, review, signed, archived]
        renewalDate:
          type: ["string", "null"]
          format: date
    Activity:
      type: object
      required: [id, kind, title, description, occurredAt]
      properties:
        id: { type: integer }
        kind: { type: string }
        title: { type: string }
        description: { type: string }
        occurredAt: { type: string, format: date-time }
        countryName:
          type: ["string", "null"]
        actorId:
          type: ["string", "null"]
        actorName:
          type: ["string", "null"]
    AuditEntry:
      allOf:
        - $ref: "#/components/schemas/Activity"
        - type: object
          required: [action, entityType]
          properties:
            action: { type: string }
            entityType: { type: string }
            entityId:
              type: ["string", "null"]
            before:
              type: ["object", "null"]
            after:
              type: ["object", "null"]
    AdminUser:
      type: object
      required: [id, name, email, role, emailVerified]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string }
        emailVerified: { type: boolean }
        memberId:
          type: ["string", "null"]
    AdminUserInput:
      type: object
      required: [email, name, role]
      properties:
        email: { type: string, format: email }
        name: { type: string, minLength: 1 }
        role:
          type: string
          enum: [global_admin, regional_director, country_lead, research, meeting_coordinator, viewer]
    AdminUserCreation:
      type: object
      required: [user, tempPassword]
      properties:
        user:
          $ref: "#/components/schemas/AdminUser"
        tempPassword: { type: string }
        verificationToken:
          type: ["string", "null"]
    UpdateUserRoleBody:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [global_admin, regional_director, country_lead, research, meeting_coordinator, viewer]
    UpdateUserRoleResponse:
      type: object
      required: [id, role]
      properties:
        id: { type: string }
        role: { type: string }
    AdminMember:
      type: object
      required: [id, organizationId, userId, role, name, email]
      properties:
        id: { type: string }
        organizationId: { type: string }
        userId: { type: string }
        role: { type: string }
        name: { type: string }
        email: { type: string }
    AdminInvitation:
      type: object
      required: [id, organizationId, email, role, status, inviterId, expiresAt]
      properties:
        id: { type: string }
        organizationId: { type: string }
        email: { type: string }
        role:
          type: ["string", "null"]
        status: { type: string }
        inviterId: { type: string }
        expiresAt:
          type: ["string", "null"]
          format: date-time
    AdminMembersOverview:
      type: object
      required: [members, invitations]
      properties:
        members:
          type: array
          items:
            $ref: "#/components/schemas/AdminMember"
        invitations:
          type: array
          items:
            $ref: "#/components/schemas/AdminInvitation"
    CreateInvitationBody:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
        role:
          type: ["string", "null"]
    InvitationCreation:
      type: object
      required: [invitation]
      properties:
        invitation:
          $ref: "#/components/schemas/AdminInvitation"
    Document:
      type: object
      required: [id, countryId, title, type, status]
      properties:
        id: { type: integer }
        countryId: { type: integer }
        title: { type: string }
        type: { type: string }
        url:
          type: ["string", "null"]
        datedOn:
          type: ["string", "null"]
          format: date
        notes:
          type: ["string", "null"]
        agreementId:
          type: ["integer", "null"]
        agreementName:
          type: ["string", "null"]
        status:
          type: string
          enum: [draft, review, approved, signed, archived]
        createdAt: { type: string, format: date-time }
    DocumentInput:
      type: object
      required: [countryId, title]
      properties:
        countryId: { type: integer }
        title: { type: string, minLength: 1 }
        type: { type: string }
        url: { type: string }
        datedOn: { type: string, format: date }
        notes: { type: string }
        agreementId: { type: integer }
        status:
          type: string
          enum: [draft, review, approved, signed, archived]
    DocumentUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1 }
        type: { type: string }
        url:
          type: ["string", "null"]
        datedOn:
          type: ["string", "null"]
          format: date
        notes:
          type: ["string", "null"]
        agreementId:
          type: ["integer", "null"]
        status:
          type: string
          enum: [draft, review, approved, signed, archived]
    News:
      type: object
      required: [id, countryId, title, source, publishedAt]
      properties:
        id: { type: integer }
        countryId: { type: integer }
        title: { type: string }
        source: { type: string }
        url:
          type: ["string", "null"]
        summary:
          type: ["string", "null"]
        publishedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    NewsInput:
      type: object
      required: [countryId, title, source, publishedAt]
      properties:
        countryId: { type: integer }
        title: { type: string, minLength: 1 }
