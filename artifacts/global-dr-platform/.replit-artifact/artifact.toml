kind = "web"
previewPath = "/"
title = "Global Diplomatic Relations"
description = "A secure diplomatic engagement workspace for managing countries, government contacts, meetings, agreements, follow-up actions, and executive relationship intelligence."
version = "1.0.0"
id = "artifacts/global-dr-platform"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25125

[services.development]
run = "pnpm --filter @workspace/global-dr-platform run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/global-dr-platform", "run", "build" ]
serve = "static"
publicDir = "artifacts/global-dr-platform/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25125"
BASE_PATH = "/"
